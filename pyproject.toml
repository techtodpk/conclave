[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conclave-council"
version = "0.7.0"
description = "An LLM council that remembers: several models research a question, critique each other, and save what they conclude to a local research store."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Deepak Kumar" }]
keywords = ["llm", "council", "research", "memory", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = ["typer>=0.12", "httpx>=0.27"]

[project.optional-dependencies]
app = ["starlette>=0.40", "uvicorn>=0.30", "markdown-it-py>=3"]
mcp = ["mcp>=2.3,<3"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mcp>=2.3,<3",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "markdown-it-py>=3",
]

[project.scripts]
conclave = "conclave.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/conclave"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
